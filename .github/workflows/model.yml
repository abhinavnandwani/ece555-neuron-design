name: Model and diagram

# Every push and PR checks saved physical evidence and reruns the C++ model.
# Licensed Spectre and Calibre experiments are not rerun by this workflow.
# Pushes to main also deploy the status page.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evidence-check dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Check evidence, run model, build page
        run: make page
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: |
            results/report.txt
            build/site/index.html
      - name: Upload page for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
